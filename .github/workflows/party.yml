# Runs every time the party games' shared base, their room server or 一起跳's move library changes:
# party-base's 40 tests (clock sync, calibration, scoring, the room state machine), the server's
# types, its session tests and the pages' build, and the dance library's schema and data checks
# (games/dance, which reads party-base's types). Only these folders.
name: party

on:
  push:
    branches: [main]
    paths: ["games/party-base/**", "games/party-server/**", "games/dance/**", ".github/workflows/party.yml"]
  pull_request:
    paths: ["games/party-base/**", "games/party-server/**", "games/dance/**", ".github/workflows/party.yml"]

# One run per change: a branch's pushes are checked through its pull request, and main after each
# merge (each push used to run twice, once for the push and once for the PR). A newer push to the
# same pull request stops the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  base:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: games/party-base
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: games/party-base/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: games/party-server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: games/party-server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  dance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: games/dance
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: games/dance/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
