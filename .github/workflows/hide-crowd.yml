# Runs every time 藏在人群里 · Hide in the Crowd changes: types, the rules and the room (unit tests),
# the build, and phones and a big screen in browsers: Chrome's engine, and WebKit (the engine in
# iPhone Safari and WeChat on iOS). The design test compares the game's tokens with the site's, so
# it runs when those change too.
name: hide-crowd

on:
  push:
    paths: ["games/hide-crowd/**", ".github/workflows/hide-crowd.yml", "site/src/styles/tokens.css", "site/src/games/registry.ts"]
  pull_request:
    paths: ["games/hide-crowd/**", ".github/workflows/hide-crowd.yml", "site/src/styles/tokens.css", "site/src/games/registry.ts"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: games/hide-crowd
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: games/hide-crowd/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright test
        env:
          CI: "1"
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: games/hide-crowd/playwright-report
          retention-days: 7
