# Runs every time 玩什么 · What's On changes: the parsers on saved feeds and a whole morning run,
# inside the Workers runtime (local D1 and KV, no network). Only this folder.
name: events

on:
  push:
    branches: [main]
    paths: ["tools/events/**", ".github/workflows/events.yml"]
  pull_request:
    paths: ["tools/events/**", ".github/workflows/events.yml"]

# One run per change: a branch's pushes are checked through its pull request, and main after each
# merge (each push used to run twice, once for the push and once for the PR). A newer push to the
# same pull request stops the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/events
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/events/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
