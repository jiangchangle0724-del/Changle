# Runs every time 随便 changes: rules and room tests, and real phones in browsers (Chrome's
# engine, and WebKit — the engine in iPhone Safari and WeChat on iOS). Only this folder.
name: suibian

on:
  push:
    paths: ["tools/suibian/**", ".github/workflows/suibian.yml"]
  pull_request:
    paths: ["tools/suibian/**", ".github/workflows/suibian.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tools/suibian
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/suibian/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright test
        env:
          CI: "1"
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: tools/suibian/playwright-report
          retention-days: 7
