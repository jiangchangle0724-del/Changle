# Runs every time the changle.ca site changes: types, the room engine's rules (incl. 到此一游's
# hand-off), 藏在人群里's hand-off (tests/hide.test.ts), 一本正经's engine and card bank
# (tests/straightface.test.ts), the DJ booth's player and stand-in DJ, the anime avatar's drawing
# words, Name That Tune's performers (every move, frame by frame), the design tokens (docs/DESIGN.md),
# the site's addresses, the times read off timed dares for their countdowns, a production build (which
# also writes one page per game for search engines and share cards), and the home page's first
# download staying within its budget (scripts/budget.ts). The phone-in-a-browser scripts in
# site/scripts need the table server and the site running, so they stay a local step (see
# site/README.md). Only this folder.
name: site

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml"]
  pull_request:
    paths: ["site/**", ".github/workflows/site.yml"]

# One run per change: a branch's pushes are checked through its pull request, and main after each
# merge (each push used to run twice, once for the push and once for the PR). A newer push to the
# same pull request stops the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx tsx tests/engine.test.ts
      - run: npx tsx tests/straightface.test.ts
      - run: npx tsx tests/dj.test.ts
      - run: npx tsx tests/dj-presets.test.ts
      - run: npx tsx tests/dj-sound.test.ts
      - run: npx tsx tests/trip.test.ts
      - run: npx tsx tests/hide.test.ts
      - run: npx tsx tests/draw.test.ts
      - run: npx tsx tests/cutout.test.ts
      - run: npx tsx tests/performer.test.ts
      - run: npx tsx tests/tokens.test.ts
      - run: npx tsx tests/routes.test.ts
      - run: npx tsx tests/duration.test.ts
      - run: npx tsx tests/tools.test.ts
      - run: npx tsx tests/split.test.ts
      - run: npm run build
      - run: npx tsx scripts/budget.ts

  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: npm run build
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            site/test-results/
            site/playwright-report/
          retention-days: 14
