# Runs every time 到此一游 changes: rules (report numbers), room logic, and real phones in
# browsers (Chrome's engine, and WebKit — the engine in iPhone Safari and WeChat on iOS).
name: been-there

on:
  push:
    paths: ["games/been-there/**", ".github/workflows/been-there.yml"]
  pull_request:
    paths: ["games/been-there/**", ".github/workflows/been-there.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    # (the browser tests alone took 22 to 25 minutes in Chromium and WebKit before the phone checks of
    # issue #37 were added)
    timeout-minutes: 45
    defaults:
      run:
        working-directory: games/been-there
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: games/been-there/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright test
        env:
          CI: "1"
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: games/been-there/playwright-report
          retention-days: 7
