name: update visual screenshots

on:
  pull_request:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: visual-update-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  update:
    if: github.event.label.name == 'update-screenshots' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: npm run build
      - run: npx playwright test --update-snapshots
      - name: Commit only CI screenshots to the unchanged PR head
        uses: actions/github-script@v8
        with:
          script: |
            const { execFileSync } = require('node:child_process');
            const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
            const pr = context.payload.pull_request;
            const current = await github.rest.pulls.get({ ...context.repo, pull_number: pr.number });
            if (current.data.head.sha !== pr.head.sha) throw new Error('PR head changed; reapply the label to regenerate.');
            git('add', '--', 'site/tests/visual/__screenshots__');
            if (git('diff', '--cached', '--name-only')) {
              git('config', 'user.name', 'github-actions[bot]');
              git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com');
              git('commit', '-m', 'test(visual): update Linux Chromium reference screenshots');
              const auth = Buffer.from(`x-access-token:${process.env.GITHUB_TOKEN}`).toString('base64');
              execFileSync('git', ['push', 'origin', `HEAD:refs/heads/${pr.head.ref}`], {
                encoding: 'utf8',
                env: { ...process.env, GIT_CONFIG_COUNT: '1', GIT_CONFIG_KEY_0: 'http.https://github.com/.extraheader', GIT_CONFIG_VALUE_0: `AUTHORIZATION: basic ${auth}` },
              });
            }
            await github.rest.issues.removeLabel({ ...context.repo, issue_number: pr.number, name: 'update-screenshots' });
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-update-results-${{ github.run_id }}
          path: |
            site/test-results/
            site/playwright-report/
          retention-days: 14
