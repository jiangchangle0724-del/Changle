<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>抓紧了 · Hang On · 主机</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Noto+Sans+SC:wght@500;700&display=swap">
<style>
  :root {
    --sky-top: #1d2a4a; --sky-bottom: #4a4f8c;
    --ink: #fff6e9; --ink-soft: #d9d2e8; --panel: rgba(16, 20, 40, .62); --card: #f8efe2; --card-ink: #2a1f3a;
    --p0: #F28CA6; --p1: #9BCF83; --p2: #F8C56D; --p3: #8EC5E8;
    --good: #9BCF83; --warn: #F8C56D; --bad: #ef5a5a;
    --font-display: "Baloo 2", "Noto Sans SC", system-ui, sans-serif;
    --font-body: "Noto Sans SC", system-ui, -apple-system, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--sky-top); color: var(--ink); font-family: var(--font-body); overflow: hidden; -webkit-user-select: none; user-select: none; }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .hud { position: fixed; top: env(safe-area-inset-top, 0px); left: 0; right: 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
    padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); pointer-events: none; }
  .hud > * { pointer-events: auto; }
  .lat { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .lat .row { display: flex; align-items: center; gap: 8px; background: var(--panel); backdrop-filter: blur(6px); border-radius: 999px; padding: 5px 12px 5px 8px; font-size: 13px; font-variant-numeric: tabular-nums; }
  .lat .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--p0); flex: none; box-shadow: inset 0 0 0 2px rgba(0,0,0,.25); }
  .lat .name { font-weight: 700; max-width: 9em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lat .ms { font-family: var(--font-display); font-weight: 800; font-size: 15px; min-width: 4.5em; text-align: right; }
  .lat .ms.good { color: var(--good); } .lat .ms.warn { color: var(--warn); } .lat .ms.bad { color: var(--bad); }
  .lat .tag { font-size: 11px; opacity: .85; border: 1px solid rgba(255,255,255,.35); border-radius: 999px; padding: 1px 7px; }
  .lat .tag.off { background: var(--bad); border-color: transparent; color: #fff; opacity: 1; }
  .lat .tag.relay { background: var(--warn); border-color: transparent; color: var(--card-ink); opacity: 1; }
  .lat .title { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); padding-left: 8px; }
  .stats { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; align-items: center; }
  .chip { background: var(--panel); backdrop-filter: blur(6px); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-variant-numeric: tabular-nums; display: inline-flex; gap: 6px; align-items: center; }
  .chip b { font-family: var(--font-display); font-size: 15px; }
  .chip.code b { font-size: 20px; letter-spacing: .15em; }
  button { font: inherit; }
  .btn { background: var(--ink); color: var(--card-ink); border: 0; border-radius: 999px; padding: 10px 18px; font-weight: 700; font-size: 15px; cursor: pointer; min-height: 44px; }
  .btn:focus-visible { outline: 3px solid var(--p3); outline-offset: 2px; }
  .btn.quiet { background: var(--panel); color: var(--ink); }
  .btn:disabled { opacity: .45; cursor: default; }
  .overlay { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(10, 12, 30, .55); backdrop-filter: blur(4px); padding: 24px; }
  .card { background: var(--card); color: var(--card-ink); border-radius: 22px; padding: 26px 28px; max-width: 760px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,.35); display: grid; grid-template-columns: auto 1fr; gap: 24px; align-items: start; }
  .card h2 { font-family: var(--font-display); font-weight: 800; font-size: 28px; margin: 0 0 4px; text-wrap: balance; }
  .card p { margin: 0 0 8px; line-height: 1.6; font-size: 14px; }
  .card .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; align-items: center; }
  .card .btn { background: var(--card-ink); color: var(--ink); }
  .card .btn.quiet { background: rgba(42,31,58,.1); color: var(--card-ink); }
  .big { font-family: var(--font-display); font-size: 40px; font-weight: 800; line-height: 1; margin: 8px 0 4px; font-variant-numeric: tabular-nums; }
  .codebig { font-family: var(--font-display); font-size: 56px; font-weight: 800; letter-spacing: .18em; line-height: 1; margin: 4px 0 10px; }
  .qr { width: 200px; height: 200px; background: #fff; border-radius: 14px; padding: 10px; box-sizing: border-box; }
  .qr svg { width: 100%; height: 100%; display: block; }
  .seats { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 2px; min-height: 36px; }
  .seat { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 6px 12px 6px 8px; background: rgba(42,31,58,.08); font-weight: 700; font-size: 14px; }
  .seat .dot { width: 16px; height: 16px; border-radius: 50%; }
  .seat.off { opacity: .5; text-decoration: line-through; }
  .seat.empty { opacity: .45; font-weight: 500; border: 1.5px dashed rgba(42,31,58,.35); background: transparent; }
  .count { font-family: var(--font-display); font-size: 160px; font-weight: 800; line-height: 1; text-shadow: 0 8px 30px rgba(0,0,0,.4); }
  .note { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--panel); backdrop-filter: blur(6px);
    border-radius: 14px; padding: 10px 14px; font-size: 13px; line-height: 1.5; max-width: min(640px, calc(100vw - 32px)); text-align: center; }
  .note kbd { font-family: var(--font-display); background: rgba(255,255,255,.14); border-radius: 6px; padding: 1px 6px; }
  @media (max-width: 720px) { .card { grid-template-columns: 1fr; } .qr { width: 160px; height: 160px; } .codebig { font-size: 44px; } .count { font-size: 110px; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<canvas id="stage" aria-label="游戏画面"></canvas>

<div class="hud">
  <div class="lat" id="lat" aria-label="延迟表"><span class="title">延迟 · 往返毫秒</span></div>
  <div class="stats">
    <span class="chip code" title="房间码">房间 <b id="code">····</b></span>
    <span class="chip">⏱ <b id="clock">0.0</b></span>
    <span class="chip">💀 <b id="deaths">0</b></span>
    <button class="btn quiet" id="lobbyBtn" type="button" hidden>回大厅</button>
  </div>
</div>

<div class="overlay" id="lobby">
  <div class="card">
    <div>
      <div class="qr" id="qr" aria-label="加入二维码"></div>
      <p style="text-align:center;margin-top:8px;font-size:12px;opacity:.75" id="joinUrl"></p>
    </div>
    <div>
      <h2>抓紧了 · Hang On</h2>
      <p>手机扫码加入，或者打开 <b id="padUrl">changle.ca/hang-on/pad</b> 输房间码。手机横着拿：左边拖是方向，右边两个大键是左右手。</p>
      <div class="codebig" id="codeBig">····</div>
      <div class="seats" id="seats"></div>
      <p id="lobbyLine" style="opacity:.75">等人进来……</p>
      <div class="row">
        <button class="btn" id="startBtn" type="button" disabled>开始</button>
        <button class="btn quiet" id="kbBtn" type="button">+ 键盘加入</button>
        <button class="btn quiet" id="relayBtn" type="button" title="测试用：不直连，全部经 Cloudflare 中转">绕路模式：关</button>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="countdown" hidden><div class="count" id="countNum">3</div></div>

<div class="overlay" id="results" hidden>
  <div class="card" style="grid-template-columns:1fr;max-width:460px">
    <div>
      <h2>到顶了！</h2>
      <div class="big" id="winTime">0.0 s</div>
      <p id="winLine"></p>
      <div class="row"><button class="btn" id="againBtn" type="button">再来一局</button></div>
    </div>
  </div>
</div>

<div class="overlay" id="fatal" hidden>
  <div class="card" style="grid-template-columns:1fr;max-width:460px">
    <div>
      <h2 id="fatalTitle">房间关了</h2>
      <p id="fatalLine"></p>
      <div class="row"><button class="btn" id="reopenBtn" type="button">再开一个房间</button></div>
    </div>
  </div>
</div>

<div class="note" id="note">主机页只在一台电脑上开，接电视。<kbd>键盘加入</kbd> 后 <kbd>W A S D</kbd> 指方向、<kbd>Q</kbd> <kbd>E</kbd> 抓，自己一个人也能试。</div>

<script type="module" src="/src/host/main.ts"></script>
</body>
</html>
