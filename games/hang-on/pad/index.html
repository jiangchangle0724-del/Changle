<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
<title>抓紧了 · Hang On · 手柄</title>
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1d2a4a">
<style>
  :root {
    --bg: #1d2a4a; --ink: #fff6e9; --ink-soft: #d9d2e8; --panel: rgba(16, 20, 40, .62); --card: #f8efe2; --card-ink: #2a1f3a;
    --p0: #F28CA6; --p1: #9BCF83; --p2: #F8C56D; --p3: #8EC5E8; --glove-l: #63b3ed; --glove-r: #f6ad55;
    --good: #9BCF83; --warn: #F8C56D; --bad: #ef5a5a;
    --font-display: "Baloo 2", "Noto Sans SC", system-ui, sans-serif;
    --font-body: "Noto Sans SC", system-ui, -apple-system, sans-serif;
    --mine: var(--p0);
    color-scheme: dark;
  }
  /* 手机上连按两下不能放大：manipulation 关掉双击缩放（Safari 只认这个），手柄区再用 none 连拖动一起关。 */
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; }
  html, body { height: 100%; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; touch-action: manipulation; -webkit-touch-callout: none; }
  #pad, #pad * { touch-action: none; }
  button { font: inherit; }
  .btn { background: var(--ink); color: var(--card-ink); border: 0; border-radius: 999px; padding: 12px 20px; font-weight: 700; font-size: 16px; cursor: pointer; min-height: 48px; }
  .btn:focus-visible { outline: 3px solid var(--p3); outline-offset: 2px; }
  .btn:disabled { opacity: .5; }

  /* 加入 */
  /* 横着拿时卡片比屏幕高：能滚，放得下就居中 */
  #join { position: fixed; inset: 0; display: flex; overflow: auto; padding: max(16px, env(safe-area-inset-left, 0px)); box-sizing: border-box; }
  .card { background: var(--card); color: var(--card-ink); border-radius: 22px; padding: 24px 24px; max-width: 420px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,.35); box-sizing: border-box; margin: auto; }
  .card h1 { font-family: var(--font-display); font-weight: 800; font-size: 26px; margin: 0 0 4px; }
  .card p { margin: 0 0 12px; line-height: 1.6; font-size: 14px; }
  .field { display: grid; gap: 6px; margin-bottom: 12px; }
  .field label { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; opacity: .7; }
  .field input { font: inherit; font-size: 20px; padding: 10px 12px; border-radius: 12px; border: 2px solid rgba(42,31,58,.2); background: #fff; color: var(--card-ink); min-height: 48px; box-sizing: border-box; width: 100%; }
  .field input.code { font-family: var(--font-display); font-weight: 800; letter-spacing: .3em; text-transform: uppercase; font-size: 28px; }
  .card .btn { background: var(--card-ink); color: var(--ink); width: 100%; }
  .card .btn.quiet { background: rgba(42,31,58,.1); color: var(--card-ink); display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 12px; }
  .err { color: var(--bad); font-weight: 700; min-height: 1.4em; }

  /* 换装：竖着一列；横着（够宽）左边预览、右边两列选项 */
  dialog { border: 0; border-radius: 22px; padding: 0; background: var(--card); color: var(--card-ink); max-width: min(760px, calc(100vw - 24px)); width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,.45);
    max-height: calc(100dvh - 24px); overflow: auto; box-sizing: border-box; }
  dialog::backdrop { background: rgba(10, 12, 30, .6); }
  .look { padding: 16px 18px 18px; display: grid; gap: 12px; }
  .look-side { display: grid; justify-items: center; gap: 6px; text-align: center; }
  .look-side h2 { font-family: var(--font-display); font-weight: 800; font-size: 20px; margin: 0; justify-self: start; }
  .look canvas { width: 120px; height: 120px; }
  .look .note { font-size: 12px; opacity: .65; margin: 0; line-height: 1.5; max-width: 220px; }
  .picks { display: grid; gap: 8px 14px; }
  .pick { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 8px; }
  .pick .lbl { grid-column: 1 / -1; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; opacity: .7; margin-bottom: -4px; }
  .pick button { min-height: 44px; border-radius: 12px; border: 0; background: rgba(42,31,58,.1); color: var(--card-ink); font-weight: 700; font-size: 18px; }
  .pick button:focus-visible { outline: 3px solid var(--p3); outline-offset: 2px; }
  .pick .val { text-align: center; font-weight: 700; font-size: 16px; }
  .look .row { display: flex; gap: 8px; margin-top: 6px; }
  .look .row .btn { flex: 1; padding-inline: 10px; background: var(--card-ink); color: var(--ink); }
  .look .row .btn.quiet { background: rgba(42,31,58,.1); color: var(--card-ink); }
  @media (min-width: 560px) { .look { grid-template-columns: 200px 1fr; align-items: start; } .picks { grid-template-columns: 1fr 1fr; } }
  @media (max-height: 460px) { .look canvas { width: 96px; height: 96px; } .look { gap: 8px; padding: 12px 16px 14px; } }
  .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .lang { min-height: 44px; min-width: 56px; border-radius: 999px; border: 2px solid rgba(42,31,58,.2); background: transparent; color: var(--card-ink); font-weight: 700; font-size: 14px; cursor: pointer; }
  .lang:focus-visible { outline: 3px solid var(--p3); outline-offset: 2px; }
  .bar .chip.btn { min-height: 44px; padding: 4px 14px; font-size: 13px; font-weight: 700; background: var(--panel); color: var(--ink); border: 0; }
  .bar .summon { background: var(--warn); color: var(--card-ink); font-weight: 800; border: 0; border-radius: 999px; padding: 6px 16px; min-height: 44px; font-size: 14px; }
  .bar .summon:disabled { opacity: .35; }

  /* 手柄 */
  #pad { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr; }
  .bar { display: flex; align-items: center; gap: 8px; padding: calc(6px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 6px max(12px, env(safe-area-inset-left, 0px)); font-size: 13px; font-variant-numeric: tabular-nums; flex-wrap: wrap; }
  .bar .me { display: inline-flex; align-items: center; gap: 8px; background: var(--mine); color: var(--card-ink); border-radius: 999px; padding: 4px 12px 4px 6px; font-weight: 700; }
  .bar .me .dot { width: 14px; height: 14px; border-radius: 50%; background: rgba(0,0,0,.25); }
  .bar .chip { background: var(--panel); border-radius: 999px; padding: 4px 10px; display: inline-flex; gap: 6px; align-items: center; }
  .bar .hand { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--glove-l); box-sizing: border-box; }
  .bar .hand.r { border-color: var(--glove-r); }
  .bar .hand.on { background: var(--glove-l); } .bar .hand.r.on { background: var(--glove-r); }
  .bar .ms.good { color: var(--good); } .bar .ms.warn { color: var(--warn); } .bar .ms.bad { color: var(--bad); }
  .bar .conn { margin-left: auto; opacity: .85; }
  .bar .conn.bad { color: var(--bad); opacity: 1; font-weight: 700; }
  .zones { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 max(12px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); min-height: 0; }
  .stickzone { position: relative; border-radius: 22px; background: rgba(255,255,255,.06); border: 2px dashed rgba(255,255,255,.22); overflow: hidden; }
  .stickzone .hint { position: absolute; inset: 0; display: grid; place-items: center; font-size: 14px; color: var(--ink-soft); text-align: center; line-height: 1.5; pointer-events: none; }
  .stick { position: absolute; width: 140px; height: 140px; margin: -70px 0 0 -70px; border-radius: 50%; border: 2px solid rgba(255,255,255,.4); pointer-events: none; }
  .stick .knob { position: absolute; left: 50%; top: 50%; width: 62px; height: 62px; margin: -31px 0 0 -31px; border-radius: 50%; background: var(--ink); box-shadow: 0 4px 14px rgba(0,0,0,.3); }
  .grabs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .grab { border-radius: 22px; border: 3px solid var(--glove-l); background: rgba(99,179,237,.14); color: var(--ink); font-family: var(--font-display); font-weight: 800; font-size: 26px; display: grid; place-items: center; line-height: 1.1; text-align: center; touch-action: none; }
  .grab span, .grab small { display: block; }
  .grab small { font-family: var(--font-body); font-weight: 500; font-size: 12px; opacity: .8; margin-top: 4px; }
  .grab.r { border-color: var(--glove-r); background: rgba(246,173,85,.14); }
  .grab.down { background: var(--glove-l); color: var(--card-ink); }
  .grab.r.down { background: var(--glove-r); }
  .flash { position: fixed; inset: 0; background: var(--bad); opacity: 0; pointer-events: none; transition: opacity .25s; }
  .flash.on { opacity: .6; transition: none; }
  .turn { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); text-align: center; padding: 24px; font-size: 18px; line-height: 1.6; z-index: 5; }
  @media (orientation: landscape) { .turn { display: none; } }
  @media (orientation: portrait) and (min-width: 700px) { .turn { display: none; } }
  @media (prefers-reduced-motion: reduce) { .flash { transition: none; } }
</style>
</head>
<body>
<div id="join">
  <form class="card" id="joinForm">
    <div class="top"><h1>抓紧了 · Hang On</h1><button class="lang" id="langBtn" type="button">EN</button></div>
    <p data-en="The room code on the TV, and your name.">电视上的房间码，和你的名字。</p>
    <div class="field"><label for="code" data-en="Room code">房间码</label><input id="code" class="code" inputmode="latin" autocomplete="off" autocapitalize="characters" maxlength="4" placeholder="ABCD" required></div>
    <div class="field"><label for="name" data-en="Name">名字</label><input id="name" autocomplete="nickname" maxlength="12" placeholder="糯米团" data-en-ph="Dumpling"></div>
    <button class="btn quiet" id="lookBtn" type="button"><canvas id="lookMini" width="44" height="44" style="width:22px;height:22px" aria-hidden="true"></canvas><span id="lookSummary">换个样子</span></button>
    <p class="err" id="err" role="alert"></p>
    <button class="btn" id="joinBtn" type="submit" data-en="Join">加入</button>
  </form>
</div>

<div id="pad" hidden>
  <div class="bar">
    <span class="me"><span class="dot"></span><span id="meName">糯米团</span></span>
    <span class="chip" title="左手 / 右手" data-en-title="Left hand / right hand"><span class="hand" id="handL"></span><span class="hand r" id="handR"></span></span>
    <span class="chip">💀 <b id="deaths">0</b></span>
    <span class="chip">⏱ <b class="ms" id="rtt">—</b></span>
    <span class="chip" id="path">连接中</span>
    <button class="chip btn" id="lookBtn2" type="button" data-en="Look">样子</button>
    <button class="summon" id="summonBtn" type="button" disabled data-en="Summon">召唤队友</button>
    <span class="conn" id="conn">连接中…</span>
  </div>
  <div class="zones">
    <div class="stickzone" id="stickzone">
      <div class="hint"><span><span data-en="Hold and drag here">这边按住拖动</span><br><span data-en="= direction">= 方向</span></span></div>
      <div class="stick" id="stick" hidden><div class="knob" id="knob"></div></div>
    </div>
    <div class="grabs">
      <button class="grab" id="grabL" type="button" aria-label="左手抓" data-en-label="Left hand: grab"><span data-en="Left">左手</span><small data-en="hold = grab">按住 = 抓</small></button>
      <button class="grab r" id="grabR" type="button" aria-label="右手抓" data-en-label="Right hand: grab"><span data-en="Right">右手</span><small data-en="hold = grab">按住 = 抓</small></button>
    </div>
  </div>
</div>
<dialog id="lookDlg" aria-label="换个样子" data-en-label="Customize">
  <div class="look">
    <div class="look-side">
      <h2 data-en="Customize">换个样子</h2>
      <canvas id="lookPreview" width="240" height="240" aria-hidden="true"></canvas>
      <p class="note" data-en="Gloves stay blue (left) and orange (right) so everyone can tell your hands apart on the TV.">手套左蓝右橙不换：电视上要分得清左右手。</p>
    </div>
    <div>
      <div class="picks" id="picks"></div>
      <div class="row">
        <button class="btn quiet" id="lookRandom" type="button" data-en="Random">随机</button>
        <button class="btn quiet" id="lookReset" type="button" data-en="Reset">清空</button>
        <button class="btn" id="lookDone" type="button" data-en="Done">就这样</button>
      </div>
    </div>
  </div>
</dialog>
<div class="flash" id="flash"></div>
<div class="turn" id="turn" hidden><div><span data-en="Turn your phone sideways">把手机横过来</span><br><small data-en="Left thumb drags to aim, right thumb holds the two big buttons">左手拖方向，右手两个大键抓</small></div></div>

<script type="module" src="/src/pad/main.ts"></script>
</body>
</html>
