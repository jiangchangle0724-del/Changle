<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>随便 出结果</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/e9760dd0ff964132b27d97b1c69aefdb">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..800&family=Unbounded:wght@600..800&display=swap">
<style>
body{margin:0;background:#0e0c22}
a{color:#ffb82e}a:hover{color:#ffcf6b}
.press{transition:transform var(--dur-exit) var(--ease-out)}
.press:active{transform:scale(0.96)}
@keyframes dim{from{opacity:0}to{opacity:1}}
@keyframes card{0%{opacity:0;transform:scale(0.86) translateY(calc(var(--motion-shift) * 2))}100%{opacity:1;transform:none}}
@keyframes slam{0%{opacity:0;transform:rotate(-8deg) scale(2.2)}55%{opacity:1;transform:rotate(-8deg) scale(0.94)}70%{transform:rotate(-8deg) scale(1.04)}100%{opacity:1;transform:rotate(-8deg) scale(1)}}
@keyframes spark{0%{opacity:0;transform:rotate(var(--a)) translateY(0) scale(0.6)}20%{opacity:1}100%{opacity:0;transform:rotate(var(--a)) translateY(-120px) scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(var(--motion-shift))}to{opacity:1;transform:none}}
.dim{animation:dim var(--dur-emphasis) var(--ease-out) both}
.card{animation:card var(--dur-emphasis) var(--ease-pop) 150ms both}
.slam{animation:slam 520ms var(--ease-out) 550ms both}
.spark{animation:spark 700ms var(--ease-out) 900ms both}
.rise{animation:rise var(--dur-enter) var(--ease-out) both}
@media (prefers-reduced-motion: reduce){.slam,.card,.spark{animation:dim var(--dur-enter) var(--ease-out) both}.spark{display:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: var(--color-bg); color: var(--color-text); font-family: var(--font-text); line-height: var(--leading)">
<div aria-hidden="true" class="dim" style="position: absolute; inset: -120px -160px auto -160px; height: 640px; background: radial-gradient(closest-side, color-mix(in oklab, var(--gel-amber) 45%, transparent), transparent); pointer-events: none"></div>
<header style="position: relative; height: var(--bar-h); display: flex; align-items: center; justify-content: center">
<div style="display: flex; flex-direction: column; align-items: center; line-height: var(--leading-tight)">
<span style="font-weight: 800; font-size: var(--text-md)">定了</span>
<span lang="en" style="font-family: var(--font-display); font-size: var(--text-xs); color: var(--color-text-2)">The pick</span>
</div>
</header>
<sc-if value="{{show}}" hint-placeholder-val="{{ true }}">
<main style="position: relative; display: flex; flex-direction: column; align-items: stretch; gap: var(--space-4); padding: var(--space-4) var(--gutter) 0">
<div style="position: relative">
<article class="card" style="display: flex; flex-direction: column; overflow: hidden; border-radius: var(--r-tile); background: var(--color-surface); box-shadow: inset 0 0 0 2px var(--type-tool), 0 24px 60px -20px color-mix(in oklab, var(--gel-amber) 80%, transparent)">
<div role="img" aria-label="餐厅照片" style="height: 180px; display: grid; place-items: center; background: var(--color-sheet); color: var(--color-text-3); font-size: var(--text-sm)">餐厅照片</div>
<div style="display: flex; flex-direction: column; gap: var(--space-2); padding: var(--pad-card)">
<h1 style="margin: 0; font-size: var(--text-xl); font-weight: 800; line-height: var(--leading-tight)">The Meat Up BBQ 聚点串吧</h1>
<span style="font-size: var(--text-sm); color: var(--color-text-2)">🍢 中式烧烤 · 串串、火锅 · 人均 $25–35</span>
<span style="font-size: var(--text-sm); font-variant-numeric: tabular-nums">4 人里 3 人想去 · 没人否决</span>
</div>
</article>
<div aria-hidden="true" style="position: absolute; left: 50%; top: 96px; width: 0; height: 0">
<sc-for list="{{sparks}}" as="s" hint-placeholder-count="12">
<span class="spark" style="{{s.style}}"></span>
</sc-for>
</div>
<p class="slam" role="status" style="position: absolute; right: var(--space-4); top: 140px; margin: 0; padding: var(--space-2) var(--space-4); border-radius: var(--r-small); border: 3px solid var(--type-tool); color: var(--type-tool); background: color-mix(in oklab, var(--color-bg) 70%, transparent); font-family: var(--font-display); font-weight: 800; font-size: var(--text-2xl); line-height: var(--leading-tight); letter-spacing: 0.04em">就它了！</p>
</div>
<div class="rise" style="display: flex; gap: var(--space-2); animation-delay: 1100ms">
<button class="press" type="button" style="flex: 1; min-height: var(--tap-crowded); display: flex; align-items: center; justify-content: center; gap: var(--space-2); border: 0; border-radius: var(--r-pill); background: var(--color-raised); color: var(--color-text); font: inherit; font-size: var(--text-md)"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 22 2l-9 19-2-8-8-2z"></path></svg>导航</button>
<button class="press" type="button" style="flex: 1; min-height: var(--tap-crowded); display: flex; align-items: center; justify-content: center; gap: var(--space-2); border: 0; border-radius: var(--r-pill); background: var(--color-raised); color: var(--color-text); font: inherit; font-size: var(--text-md)"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2Z"></path></svg>订位</button>
</div>
<p class="rise" style="margin: 0; text-align: center; font-size: var(--text-sm); color: var(--color-text-2); animation-delay: 1200ms">吃完回来评一下，三下就好</p>
</main>
</sc-if>
<footer style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; gap: var(--space-2); padding: 0 var(--gutter) var(--space-4)">
<button class="press" type="button" style="min-height: 56px; display: flex; align-items: center; justify-content: center; gap: var(--space-2); border: 0; border-radius: var(--r-pill); background: var(--type-tool); color: var(--color-on-accent); font: inherit; font-size: var(--text-lg); font-weight: 800; box-shadow: 0 10px 30px -12px color-mix(in oklab, var(--gel-amber) 75%, transparent)"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"></path></svg>发到群里</button>
<button class="press" type="button" onClick="{{replay}}" style="min-height: var(--tap); border: 0; border-radius: var(--r-pill); background: transparent; color: var(--color-text-3); font: inherit; font-size: var(--text-xs)">样稿用：再放一次动画</button>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { show: true };
  }
  renderVals() {
    const colors = ['var(--gel-amber)', 'var(--gel-honey)', 'var(--gel-mint)', 'var(--gel-amber)'];
    return {
      show: this.state.show,
      sparks: Array.from({ length: 12 }, (_, i) => ({
        style: '--a: ' + (i * 30) + 'deg; position: absolute; left: -4px; top: -4px; width: ' + (i % 3 === 0 ? 10 : 7) + 'px; height: ' + (i % 3 === 0 ? 10 : 7) + 'px; border-radius: var(--r-pill); background: ' + colors[i % 4] + '; animation-delay: ' + (900 + (i % 4) * 30) + 'ms',
      })),
      replay: () => {
        this.setState({ show: false });
        setTimeout(() => this.setState({ show: true }), 60);
      },
    };
  }
}
</script>
</body>
</html>
