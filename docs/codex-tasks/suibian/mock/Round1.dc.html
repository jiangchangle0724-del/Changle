<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>随便 第 1 轮</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/e9760dd0ff964132b27d97b1c69aefdb">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..800&family=Unbounded:wght@600..800&display=swap">
<style>
body{margin:0;background:#0e0c22}
a{color:#ffb82e}a:hover{color:#ffcf6b}
.press{transition:transform var(--dur-exit) var(--ease-out),background-color var(--dur-enter) var(--ease-out),box-shadow var(--dur-enter) var(--ease-out),opacity var(--dur-enter) var(--ease-out)}
.press:active{transform:scale(0.95)}
@keyframes like{0%{transform:scale(1)}40%{transform:scale(1.35) rotate(-8deg)}100%{transform:scale(1)}}
@keyframes nope{0%,100%{transform:none}25%{transform:translateX(calc(var(--motion-shift) / -3))}75%{transform:translateX(calc(var(--motion-shift) / 3))}}
@keyframes stamp{0%{opacity:0;transform:scale(1.8)}100%{opacity:1;transform:scale(1)}}
@keyframes tick{0%,100%{transform:scale(1)}30%{transform:scale(1.18)}}
.urgent{animation:tick 1s var(--ease-out) infinite}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: var(--color-bg); color: var(--color-text); font-family: var(--font-text); line-height: var(--leading)">
<div aria-hidden="true" style="position: absolute; inset: -180px -120px auto -120px; height: 380px; background: radial-gradient(closest-side, color-mix(in oklab, var(--gel-amber) 26%, transparent), transparent); pointer-events: none"></div>
<header style="position: relative; height: var(--bar-h); display: flex; align-items: center; justify-content: space-between; padding: 0 var(--space-2)">
<button class="press" type="button" aria-label="返回" style="width: var(--tap); height: var(--tap); display: grid; place-items: center; border: 0; border-radius: var(--r-pill); background: transparent; color: var(--color-text-2)">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>
</button>
<div style="display: flex; flex-direction: column; align-items: center; line-height: var(--leading-tight)">
<span style="font-weight: 800; font-size: var(--text-md)">第 1 轮 · 想吃什么</span>
<span lang="en" style="font-family: var(--font-display); font-size: var(--text-xs); color: var(--color-text-2)">Round 1 · Cravings</span>
</div>
<span role="timer" aria-live="off" style="{{clockStyle}}"><span class="{{clockClass}}" style="display: inline-block">{{clock}}</span></span>
</header>

<main style="position: relative; display: flex; flex-direction: column; gap: var(--space-3); padding: 0 var(--gutter)">
<p style="margin: 0; font-size: var(--text-sm); color: var(--color-text-2)">点一下想吃，再点一下不想吃，再点一下取消。大家想吃的会排在最前面。</p>
<h2 style="margin: var(--space-2) 0 0; font-size: var(--text-sm); font-weight: 700; color: var(--color-text-2); letter-spacing: 0.08em">中餐</h2>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-2)">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="12">
<button class="press" type="button" aria-pressed="{{c.pressed}}" aria-label="{{c.aria}}" onClick="{{c.cycle}}" style="{{c.style}}">
<span style="display: flex; justify-content: space-between; align-items: flex-start; width: 100%">
<span aria-hidden="true" style="{{c.emojiStyle}}">{{c.emoji}}</span>
<span aria-hidden="true" style="{{c.markStyle}}">{{c.mark}}</span>
</span>
<span style="{{c.labelStyle}}">{{c.label}}</span>
</button>
</sc-for>
</div>
<h2 style="margin: var(--space-2) 0 0; font-size: var(--text-sm); font-weight: 700; color: var(--color-text-2); letter-spacing: 0.08em">亚洲菜 · 西餐和其他 · 自助</h2>
</main>

<footer style="position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--dock-h) + var(--space-8)); display: flex; flex-direction: column; justify-content: flex-end; gap: var(--space-2); padding: 0 var(--gutter) var(--space-4); background: linear-gradient(to top, var(--color-bg) 75%, transparent)">
<div style="display: flex; align-items: center; justify-content: center; gap: var(--space-2); font-size: var(--text-xs); color: var(--color-text-2)">
<span aria-hidden="true" style="width: 8px; height: 8px; border-radius: var(--r-pill); background: var(--color-success)"></span>
<span aria-hidden="true" style="width: 8px; height: 8px; border-radius: var(--r-pill); background: var(--color-success)"></span>
<span aria-hidden="true" style="width: 8px; height: 8px; border-radius: var(--r-pill); background: var(--color-success)"></span>
<span aria-hidden="true" style="width: 8px; height: 8px; border-radius: var(--r-pill); background: var(--color-raised)"></span>
<span>3/4 人选好了</span>
</div>
<button class="press" type="button" style="min-height: 56px; border: 0; border-radius: var(--r-pill); background: var(--type-tool); color: var(--color-on-accent); font: inherit; font-size: var(--text-lg); font-weight: 800; box-shadow: 0 10px 30px -12px color-mix(in oklab, var(--gel-amber) 75%, transparent)">好了</button>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"urgent":{"editor":"boolean","default":false,"section":"倒计时"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picks: { chinese_bbq: 'like', hotpot: 'like', noodles: 'ban' }, n: 0 };
  }
  renderVals() {
    const menu = [
      ['cantonese', '🥟', '粤菜 · 点心'], ['hk_cafe', '🧋', '港式茶餐厅'], ['sichuan', '🌶️', '川菜 · 湘菜'],
      ['hotpot', '🍲', '火锅'], ['taiwanese', '🍚', '台湾菜'], ['shanghai', '🦀', '上海 · 江浙菜'],
      ['northern', '🫓', '东北 · 西北菜'], ['noodles', '🍜', '面馆 · 饺子'], ['chinese_bbq', '🍢', '中式烧烤 · 串串'],
      ['chinese', '🥡', '其他中餐'], ['japanese', '🍣', '日料 · 寿司'], ['ayce', '🍽️', '自助 · 放题'],
    ];
    const next = { none: 'like', like: 'ban', ban: 'none' };
    const base = 'min-height: 92px; display: flex; flex-direction: column; justify-content: space-between; gap: var(--space-2); padding: var(--space-3); border: 0; border-radius: var(--r-tile); font: inherit; text-align: left; color: var(--color-text);';
    const urgent = !!this.props.urgent;
    return {
      clock: urgent ? '还剩 8 秒' : '还剩 74 秒',
      clockClass: urgent ? 'urgent' : '',
      clockStyle: 'min-height: var(--tap); display: grid; place-items: center; padding: 0 var(--space-3); border-radius: var(--r-pill); font-size: var(--text-sm); font-weight: 700; font-variant-numeric: tabular-nums; '
        + (urgent ? 'background: var(--color-danger); color: var(--color-on-danger)' : 'background: var(--color-surface); box-shadow: var(--shadow-flat); color: var(--color-text)'),
      chips: menu.map(([id, emoji, label]) => {
        const now = this.state.picks[id] || 'none';
        const style = now === 'like'
          ? base + ' background: color-mix(in oklab, var(--color-success) 16%, var(--color-surface)); box-shadow: inset 0 0 0 2px var(--color-success)'
          : now === 'ban'
            ? base + ' background: var(--color-sheet); box-shadow: inset 0 0 0 1px var(--color-line); opacity: 0.6; animation: nope var(--dur-enter) var(--ease-out)'
            : base + ' background: var(--color-surface); box-shadow: var(--shadow-flat)';
        return {
          emoji,
          label,
          pressed: now === 'none' ? 'false' : 'true',
          aria: label + (now === 'like' ? '，想吃' : now === 'ban' ? '，不想吃' : ''),
          style,
          emojiStyle: 'font-size: 28px; line-height: 1; display: inline-block;' + (now === 'like' ? ' animation: like var(--dur-emphasis) var(--ease-pop)' : ''),
          mark: now === 'like' ? '想吃' : now === 'ban' ? '不想' : '',
          markStyle: now === 'like'
            ? 'padding: 2px var(--space-2); border-radius: var(--r-pill); background: var(--color-success); color: var(--color-on-accent); font-size: var(--text-xs); font-weight: 800; animation: stamp var(--dur-enter) var(--ease-pop)'
            : now === 'ban'
              ? 'padding: 2px var(--space-2); border-radius: var(--r-pill); background: var(--color-raised); color: var(--color-text-2); font-size: var(--text-xs); font-weight: 700'
              : 'display: none',
          labelStyle: 'font-size: var(--text-sm); font-weight: 700; line-height: var(--leading-tight);' + (now === 'ban' ? ' text-decoration: line-through; color: var(--color-text-2)' : ''),
          cycle: () => this.setState({ picks: { ...this.state.picks, [id]: next[now] } }),
        };
      }),
    };
  }
}
</script>
</body>
</html>
