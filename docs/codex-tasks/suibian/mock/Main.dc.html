<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>随便 首页</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/e9760dd0ff964132b27d97b1c69aefdb">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..800&family=Unbounded:wght@600..800&display=swap">
<style>
body{margin:0;background:#0e0c22}
a{color:#ffb82e}a:hover{color:#ffcf6b}
.press{transition:transform var(--dur-exit) var(--ease-out),background-color var(--dur-enter) var(--ease-out),color var(--dur-enter) var(--ease-out)}
.press:active{transform:scale(0.96)}
.pop{animation:pop var(--dur-emphasis) var(--ease-pop)}
@keyframes pop{0%{transform:scale(0.9)}100%{transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(var(--motion-shift))}to{opacity:1;transform:none}}
.rise{animation:rise var(--dur-enter) var(--ease-out) both}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: var(--color-bg); color: var(--color-text); font-family: var(--font-text); line-height: var(--leading)">
<div aria-hidden="true" style="position: absolute; inset: -160px -120px auto -120px; height: 460px; background: radial-gradient(closest-side, color-mix(in oklab, var(--gel-amber) 34%, transparent), transparent); pointer-events: none"></div>
<header style="position: relative; height: var(--bar-h); display: flex; align-items: center; justify-content: space-between; padding: 0 var(--space-2)">
<button class="press" type="button" style="min-height: var(--tap); display: flex; align-items: center; gap: var(--space-1); padding: 0 var(--space-3); border: 0; border-radius: var(--r-pill); background: transparent; color: var(--color-text-2); font: inherit; font-size: var(--text-sm)">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>
工具
</button>
<div style="display: flex; flex-direction: column; align-items: center; line-height: var(--leading-tight)">
<span style="font-weight: 800; font-size: var(--text-md)">随便</span>
<span lang="en" style="font-family: var(--font-display); font-size: var(--text-xs); color: var(--color-text-2)">Whatever's Fine</span>
</div>
<button class="press" type="button" aria-label="Switch to English" style="min-width: var(--tap); min-height: var(--tap); padding: 0 var(--space-3); border: 0; border-radius: var(--r-pill); background: var(--color-surface); box-shadow: var(--shadow-flat); color: var(--color-text); font-family: var(--font-display); font-size: var(--text-xs); font-weight: 700">EN</button>
</header>

<main style="position: relative; display: flex; flex-direction: column; gap: var(--gap-section); padding: var(--space-4) var(--gutter) 0">
<section class="rise" style="display: flex; flex-direction: column; gap: var(--space-2)">
<h1 style="margin: 0; font-family: var(--font-display); font-weight: 800; font-size: var(--text-3xl); line-height: var(--leading-tight); letter-spacing: 0.02em">吃什么？<span style="color: var(--type-tool)">随便。</span></h1>
<p style="margin: 0; font-size: var(--text-lg); color: var(--color-text-2)">那就让大家的手机来定。</p>
</section>

<section class="rise" style="display: flex; flex-direction: column; gap: var(--space-4); padding: var(--pad-card); border-radius: var(--r-panel); background: var(--color-surface); box-shadow: var(--shadow-flat); animation-delay: 40ms">
<div style="display: flex; flex-direction: column; gap: var(--space-2)">
<span style="font-size: var(--text-sm); color: var(--color-text-2)">什么场合</span>
<div style="display: flex; flex-wrap: wrap; gap: var(--space-2)">
<sc-for list="{{occasions}}" as="o" hint-placeholder-count="9">
<button class="press" type="button" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}" style="{{o.style}}">{{o.label}}</button>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: var(--space-2)">
<span style="font-size: var(--text-sm); color: var(--color-text-2)">什么时候</span>
<div role="group" aria-label="什么时候" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--space-1); padding: var(--space-1); border-radius: var(--r-pill); background: var(--color-sheet)">
<button class="press" type="button" aria-pressed="true" style="min-height: var(--tap-crowded); border: 0; border-radius: var(--r-pill); background: var(--color-raised); color: var(--color-text); font: inherit; font-size: var(--text-sm); font-weight: 700">现在</button>
<button class="press" type="button" aria-pressed="false" style="min-height: var(--tap-crowded); border: 0; border-radius: var(--r-pill); background: transparent; color: var(--color-text-2); font: inherit; font-size: var(--text-sm)">今晚</button>
<button class="press" type="button" aria-pressed="false" style="min-height: var(--tap-crowded); border: 0; border-radius: var(--r-pill); background: transparent; color: var(--color-text-2); font: inherit; font-size: var(--text-sm)">明天中午</button>
<button class="press" type="button" aria-pressed="false" style="min-height: var(--tap-crowded); border: 0; border-radius: var(--r-pill); background: transparent; color: var(--color-text-2); font: inherit; font-size: var(--text-sm)">选时间</button>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: var(--space-2)">
<span style="font-size: var(--text-sm); color: var(--color-text-2)">在哪儿</span>
<button class="press" type="button" style="min-height: var(--tap-crowded); display: flex; align-items: center; gap: var(--space-2); padding: 0 var(--space-4); border: 0; border-radius: var(--r-field); background: var(--color-sheet); box-shadow: inset 0 0 0 1px var(--color-line); color: var(--color-text); font: inherit; font-size: var(--text-md); text-align: left">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--type-tool); flex: none"><path d="M20 10c0 5-8 12-8 12s-8-7-8-12a8 8 0 0 1 16 0Z"></path><circle cx="12" cy="10" r="3"></circle></svg>
<span style="flex: 1">Richmond Centre / Aberdeen</span>
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--color-text-2)"><path d="m6 9 6 6 6-6"></path></svg>
</button>
</div>

<div style="display: flex; flex-direction: column; gap: var(--space-2)">
<span style="font-size: var(--text-sm); color: var(--color-text-2)">多远</span>
<div style="display: flex; gap: var(--space-2); flex-wrap: wrap">
<button class="press" type="button" aria-pressed="true" style="min-height: var(--tap-crowded); padding: 0 var(--space-4); border: 0; border-radius: var(--r-pill); background: var(--color-text); color: var(--color-bg); font: inherit; font-size: var(--text-sm); font-weight: 700">走路 10 分钟</button>
<button class="press" type="button" aria-pressed="false" style="min-height: var(--tap-crowded); padding: 0 var(--space-4); border: 0; border-radius: var(--r-pill); background: var(--color-raised); color: var(--color-text); font: inherit; font-size: var(--text-sm)">开车 15 分钟</button>
<button class="press" type="button" aria-pressed="false" style="min-height: var(--tap-crowded); padding: 0 var(--space-4); border: 0; border-radius: var(--r-pill); background: var(--color-raised); color: var(--color-text); font: inherit; font-size: var(--text-sm)">不限</button>
</div>
</div>
</section>

<div class="rise" style="display: flex; flex-direction: column; gap: var(--space-3); animation-delay: 80ms">
<button class="press" type="button" style="min-height: 56px; border: 0; border-radius: var(--r-pill); background: var(--type-tool); color: var(--color-on-accent); font: inherit; font-size: var(--text-lg); font-weight: 800; box-shadow: 0 10px 30px -12px color-mix(in oklab, var(--gel-amber) 75%, transparent)">开一桌</button>
<button class="press" type="button" style="min-height: var(--tap); border: 0; border-radius: var(--r-pill); background: transparent; color: var(--color-text-2); font: inherit; font-size: var(--text-md)">有桌号？加入一桌</button>
</div>
</main>
<footer style="position: absolute; left: 0; right: 0; bottom: var(--space-4); display: flex; justify-content: center; gap: var(--space-4); font-size: var(--text-xs); color: var(--color-text-3)">
<a href="#privacy" style="color: var(--color-text-3); text-decoration: none">隐私政策</a>
<a href="#terms" style="color: var(--color-text-3); text-decoration: none">使用条款</a>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: 'casual' };
  }
  renderVals() {
    const all = [
      ['casual', '随便吃吃'], ['friends', '朋友聚会'], ['date', '约会'], ['colleagues', '同事聚餐'], ['family', '家庭聚餐'],
      ['birthday', '生日'], ['business', '商务宴请'], ['solo', '一个人'], ['latenight', '宵夜'],
    ];
    const base = 'min-height: var(--tap-crowded); padding: 0 var(--space-4); border: 0; border-radius: var(--r-pill); font: inherit; font-size: var(--text-sm);';
    return {
      occasions: all.map(([id, label]) => {
        const on = this.state.picked === id;
        return {
          label,
          pressed: on ? 'true' : 'false',
          style: on
            ? base + ' background: var(--type-tool); color: var(--color-on-accent); font-weight: 800; animation: pop var(--dur-emphasis) var(--ease-pop)'
            : base + ' background: var(--color-raised); color: var(--color-text)',
          pick: () => this.setState({ picked: id }),
        };
      }),
    };
  }
}
</script>
</body>
</html>
